<!doctype html>
<html lang="es-ES">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#03060C" />
    <title>Sin conexión · ELEVATE 30</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px max(20px, env(safe-area-inset-left));
        background: #03060c;
        color: #f8fafc;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      main {
        max-width: 360px;
        display: grid;
        gap: 16px;
        justify-items: center;
      }
      img {
        width: 72px;
        height: auto;
      }
      h1 {
        margin: 8px 0 0;
        font-size: 30px;
        line-height: 1.05;
        letter-spacing: -0.03em;
      }
      p {
        margin: 0;
        color: #94a3b8;
        font-size: 17px;
        line-height: 1.5;
      }
      button {
        margin-top: 8px;
        min-height: 52px;
        padding: 0 28px;
        border: 0;
        border-radius: 9999px;
        background: #0066ff;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid #00d9ff;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/isotipo.webp" alt="" width="72" height="66" />
      <h1>Sin conexión</h1>
      <p>Necesitas internet para ver tu día y guardar tus check-ins. Vuelve a intentarlo cuando tengas conexión.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
